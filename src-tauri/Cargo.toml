[package]
name = "wuwatappo-linux"
description = "Unofficial, experimental Linux shell for the Wuwa Tappo frontend (research project)"
license = "MIT"
repository = "https://github.com/crazyads69/wuwa-tappo-linux-experimental"
publish = false
version = "1.0.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gtk = "0.18"
webkit2gtk = "2"
url = "2"
libc = "0.2"
zbus = "5"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
tauri-plugin-deep-link = "2.6"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
